[project]
name = "whichtool"
version = "0.1.0"
description = "Do AI agents recommend the best tool for the job? Ask frontier models to pick a hosted API and record what they pick."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.4.0",
    "openai>=3.42.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
whichtool-run = "whichtool.run:main"
whichtool-classify = "whichtool.classify:main"
whichtool-estimate = "whichtool.estimate:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["whichtool"]

[tool.pytest.ini_options]
testpaths = ["tests"]
