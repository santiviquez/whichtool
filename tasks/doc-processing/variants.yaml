  - id: j4-v01
    job_id: j4
    text: >-
      We pull financial tables out of 8,000 annual reports a month. Most are digital PDFs, but
      some have scanned pages with small text, and they're in English and French. Our Java
      service needs each table as CSV with row labels, column headers, units, negative numbers
      and footnote references kept intact. Merged cells and multi-level headers give us the
      most trouble. A single misplaced number can change a whole financial comparison.
      Analysts can wait for results and the budget is flexible, but checking thousands of
      cells by hand defeats the purpose. Which API would you recommend?
  - id: j4-v02
