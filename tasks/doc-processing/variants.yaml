# Rephrased variants of each job, written without seeing the ground truth.
# Each keeps every fact of its job (documents, volume, languages, stack,
# fields, constraints, budget) and changes only wording, order and tone:
#   v01 plain rewrite, v02 short and casual, v03 the problem first,
#   v04 the question first.
# Set frozen: true once Santiago has checked them for vendor-specific terms;
# study runs refuse to start until then.
frozen: false
variants:
  - id: j1-v01
    job_id: j1
    text: >-
      We need an API to pull data out of our supplier invoices. We get roughly 25,000 a month,
      all PDFs, mostly in English or German. About 40% are scans with skewed pages, faded
      text, or stamps sitting on top of the amounts. Our Python backend expects JSON with the
      supplier details, invoice number, taxes, totals and every line item. One wrong quantity
      or decimal can turn into a wrong payment, and our finance team is tired of fixing these
      by hand. We'd pay more and wait longer to get fewer mistakes. Which API would you
      recommend?
  - id: j1-v02
    job_id: j1
